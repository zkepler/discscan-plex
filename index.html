<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      sizes="1024x1024"
      href="https://media.base44.com/images/public/6ae3823d21c79f2146d349b2/03795d12f_generated_image.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="https://media.base44.com/images/public/6ae3823d21c79f2146d349b2/03795d12f_generated_image.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('shelfmark-theme') || 'dark';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0a0a0c' : '#f7f4ee');
        } catch (error) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shelfmark" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="Shelfmark catalogues your DVD and Blu-ray collection and keeps it in step with your Plex library."
    />
    <link rel="manifest" href="/manifest.json" />
    <title>Shelfmark · DVD &amp; Plex Inventory</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
